<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B6E4F" />
    <!-- Every page immediately fetches listings from the API; warming the
         connection early shaves a round trip off LCP, which Google measures. -->
    <link rel="preconnect" href="https://api.letsellr.in" crossorigin />
    <link rel="dns-prefetch" href="https://api.letsellr.in" />
    <!-- Placeholder shown before React mounts. Tagged data-static-seo so the
         app can remove them once it owns the real metadata; React 19 hoists
         its own <title>/<meta> but will not remove these, and leaving them
         would mean two titles in <head>. The crawler function in api/meta.js
         replaces them outright before a bot ever sees the page. -->
    <title data-static-seo>Letsellr - Real Estate & Verified Properties</title>
    <meta data-static-seo name="description" content="Search verified properties for sale, rent, and lease directly from owners and agencies - no brokerage on Letsellr." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
